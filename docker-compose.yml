version: '3.8'

# =============================================================================
# CyberRiskOS — Production Docker Compose
# Phase 9 — Container Finalization
# Architecture:
#   Browser → Frontend (nginx) → Backend API Gateway → Python Risk Engine
#                                                    ↓
#                                               PostgreSQL
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — Authoritative data store
  # ---------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    container_name: cyberriskos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-cyberriskos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # No public port exposure — only accessible internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberadmin} -d ${POSTGRES_DB:-cyberriskos}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Python Risk Engine — Internal calculation service
  # NOT exposed publicly; only accessible to the backend API gateway
  # ---------------------------------------------------------------------------
  risk-engine:
    build:
      context: ./risk-engine
      dockerfile: Dockerfile
    container_name: cyberriskos-risk-engine
    environment:
      - PORT=8000
    networks:
      - internal
    # No public port — browser must never call this directly
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Node API Gateway — Only service that calls the Python risk engine
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberriskos-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cyberadmin}:${POSTGRES_PASSWORD:-changeme-in-production}@database:5432/${POSTGRES_DB:-cyberriskos}
      - RISK_ENGINE_URL=http://risk-engine:8000
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - AI_EXPLANATION_PROVIDER=${AI_EXPLANATION_PROVIDER:-TEMPLATE}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - internal
      - external
    depends_on:
      database:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — nginx serving the Vite production build
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberriskos-frontend
    ports:
      - "3000:80"
    networks:
      - external
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  # Internal: database + risk-engine + backend only
  internal:
    driver: bridge
    internal: true
  # External: backend (API) + frontend (nginx) only
  external:
    driver: bridge

volumes:
  postgres_data:
