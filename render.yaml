# =============================================================================
# CyberRiskOS — Render Infrastructure Blueprint Specification
# Deploys Managed PostgreSQL + Python Risk Engine + Express API Gateway + Vite Frontend
# =============================================================================

databases:
  - name: cyberriskos-db
    databaseName: cyberriskos
    user: cyberadmin
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. Python Risk Engine Microservice (FastAPI / Uvicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: cyberriskos-risk-engine
    runtime: python
    rootDir: risk-engine
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # ---------------------------------------------------------------------------
  # 2. Node.js API Gateway & Orchestrator (Express / TypeScript)
  # ---------------------------------------------------------------------------
  - type: web
    name: cyberriskos-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyberriskos-db
          property: connectionString
      - key: RISK_ENGINE_URL
        fromService:
          type: web
          name: cyberriskos-risk-engine
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: '*'

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Application (Vite / React SPA)
  # ---------------------------------------------------------------------------
  - type: web
    runtime: static
    name: cyberriskos-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cyberriskos-backend
          property: host
